<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>株式会社はぐめいど — 医学生の国際キャリアを、企業と共に創る。</title>
<meta name="description" content="はぐめいどは、情報が届きにくいあらゆる場所に情報を届ける会社です。海外留学支援を入口に、将来の地域医療を支え...">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Noto+Sans+JP:wght@300;400;500;600;700&family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============ Design Tokens ============ */
  :root {
    --navy-900: #0A2540;
    --navy-800: #143559;
    --navy-700: #1E4874;
    --navy-500: #3D6A94;
    --teal-600: #0891A6;
    --teal-500: #1BA7BC;
    --teal-100: #D6EEF2;
    --coral: #E8735A;
    --coral-soft: #F3A48F;
    --paper: #FAFAF7;
    --paper-2: #F2F0EA;
    --ink-900: #0F1B2A;
    --ink-700: #2C3B4F;
    --ink-500: #5A6B80;
    --ink-400: #8C99AB;
    --line: #DDD8CE;
    --line-strong: #B8B2A5;

    --font-sans: "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    --font-serif: "Noto Serif JP", "Hiragino Mincho ProN", serif;
    --font-display: "Fraunces", "Noto Serif JP", serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;

    --max: 1240px;
    --gutter: clamp(20px, 4vw, 48px);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-weight: 400;
    color: var(--ink-900);
    background: var(--paper);
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  img, svg { max-width: 100%; display: block; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }

  ::selection { background: var(--navy-900); color: var(--paper); }

  /* ============ Layout ============ */
  .wrap {
    max-width: var(--max);
    margin: 0 auto;
    padding: 0 var(--gutter);
  }

  section {
    padding: clamp(80px, 12vw, 140px) 0;
    position: relative;
  }

  /* ============ Nav ============ */
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 18px 0;
    transition: background .3s ease, backdrop-filter .3s ease, border-color .3s ease;
    border-bottom: 1px solid transparent;
  }
  .nav.scrolled {
    background: rgba(250, 250, 247, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom-color: var(--line);
  }
  .nav-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 0.02em;
    color: var(--navy-900);
  }
  .brand-mark {
    width: 32px; height: 32px;
  }
  .nav-links {
    display: flex;
    gap: 28px;
    font-size: 13px;
    color: var(--ink-700);
    letter-spacing: 0.04em;
  }
  .nav-links a { transition: color .2s; }
  .nav-links a:hover { color: var(--teal-600); }
  .nav-cta {
    padding: 10px 20px;
    background: var(--navy-900);
    color: var(--paper);
    border-radius: 999px;
    font-size: 13px;
    letter-spacing: 0.05em;
    transition: background .2s, transform .2s;
  }
  .nav-cta:hover { background: var(--teal-600); transform: translateY(-1px); }

  @media (max-width: 840px) {
    .nav-links { display: none; }
  }

  /* ============ Hero ============ */
  .hero {
    padding-top: clamp(140px, 20vw, 200px);
    padding-bottom: clamp(80px, 10vw, 120px);
    overflow: hidden;
    position: relative;
  }
  .hero-grid {
    display: grid;
    grid-template-columns: 1.05fr 0.95fr;
    gap: clamp(40px, 6vw, 80px);
    align-items: center;
  }
  @media (max-width: 900px) {
    .hero-grid { grid-template-columns: 1fr; }
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--teal-600);
    text-transform: uppercase;
    margin-bottom: 32px;
  }
  .eyebrow::before {
    content: "";
    width: 24px; height: 1px;
    background: var(--teal-600);
  }

  .hero h1 {
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: clamp(32px, 5.2vw, 60px);
    line-height: 1.3;
    letter-spacing: -0.01em;
    margin: 0 0 28px;
    color: var(--navy-900);
    text-wrap: pretty;
  }
  .hero h1 .accent {
    color: var(--teal-600);
  }
  .hero-sub {
    font-family: var(--font-serif);
    font-size: clamp(17px, 1.8vw, 21px);
    color: var(--ink-700);
    line-height: 1.9;
    margin: 0 0 40px;
    max-width: 32em;
  }
  .hero-sub strong {
    font-weight: 600;
    color: var(--navy-900);
    background: linear-gradient(transparent 65%, rgba(232, 115, 90, 0.18) 65%);
    padding: 0 2px;
  }
  .hero-ctas {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
  }
  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 16px 30px;
    background: var(--navy-900);
    color: var(--paper);
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.05em;
    transition: background .25s, transform .25s;
    border: none;
  }
  .btn-primary:hover { background: var(--teal-600); transform: translateY(-2px); }
  .btn-primary svg { transition: transform .25s; }
  .btn-primary:hover svg { transform: translateX(4px); }

  .btn-ghost {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 24px;
    color: var(--navy-900);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.05em;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    transition: border-color .25s, color .25s, background .25s;
    background: transparent;
  }
  .btn-ghost:hover { border-color: var(--navy-900); background: var(--paper-2); }

  /* Hero visual: connected map illustration */
  .hero-visual {
    position: relative;
    aspect-ratio: 1 / 1;
    max-width: 560px;
    margin-left: auto;
  }
  .hero-visual img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* ============ Section headers ============ */
  .sec-head {
    max-width: 780px;
    margin-bottom: 72px;
  }
  .sec-tag {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--teal-600);
    text-transform: uppercase;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .sec-tag::before {
    content: "";
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--teal-600);
  }
  .sec-title {
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: clamp(28px, 3.6vw, 44px);
    line-height: 1.4;
    letter-spacing: -0.005em;
    margin: 0 0 24px;
    color: var(--navy-900);
    text-wrap: balance;
  }
  .sec-lede {
    font-size: 16px;
    line-height: 1.95;
    color: var(--ink-700);
    max-width: 42em;
  }

  /* ============ Story (相似形の格差) ============ */
  .story { background: var(--paper-2); }
  .story-diagram {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: clamp(24px, 4vw, 56px);
    align-items: stretch;
    margin-top: 40px;
  }
  @media (max-width: 820px) {
    .story-diagram { grid-template-columns: 1fr; }
    .story-connector { display: none !important; }
  }
  .story-card {
    background: var(--paper);
    padding: clamp(28px, 3.5vw, 44px);
    border: 1px solid var(--line);
    position: relative;
  }
  .story-card-num {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--ink-400);
    margin-bottom: 20px;
  }
  .story-card h3 {
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: clamp(20px, 2.2vw, 26px);
    color: var(--navy-900);
    margin: 0 0 16px;
    line-height: 1.5;
  }
  .story-card p {
    font-size: 15px;
    color: var(--ink-700);
    line-height: 1.9;
    margin: 0 0 24px;
  }
  .story-map {
    aspect-ratio: 16 / 10;
    background: var(--paper-2);
    border: 1px solid var(--line);
    position: relative;
    overflow: hidden;
  }
  .story-map svg,
  .story-map img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* rest of CSS unchanged */
</style>
</head>
<body>
<nav class="nav">
  <div class="wrap nav-inner">
    <div class="brand">
      <div class="brand-mark"><img src="assets/brand-mark.svg" alt="Hugmeid"></div>
      株式会社はぐめいど
    </div>
    <div class="nav-links">
      <a href="#services">サービス</a>
      <a href="#story">相似形の格差</a>
      <a href="#news">ニュース</a>
    </div>
    <a class="nav-cta" href="#contact">お問い合わせ</a>
  </div>
</nav>

<main>
  <section class="hero">
    <div class="wrap hero-grid">
      <div>
        <div class="eyebrow">私たちについて</div>
        <h1>医学生の国際キャリアを、企業と共に創る。</h1>
        <p class="hero-sub">はぐめいどは、情報が届きにくい場所に情報を届けます。</p>
        <div class="hero-ctas">
          <a class="btn-primary" href="#contact">相談する</a>
          <a class="btn-ghost" href="#about">詳しく</a>
        </div>
      </div>
      <div class="hero-visual">
        <img src="assets/hero-map.png" alt="map illustration">
      </div>
    </div>
  </section>

  <section class="story">
    <div class="wrap sec-head">
      <div class="sec-tag">相似形の格差</div>
      <h2 class="sec-title">地域ごとの情報格差を可視化する</h2>
    </div>

    <div class="wrap story-diagram">
      <div class="story-card">
        <div class="story-card-num">01</div>
        <h3>都市部</h3>
        <p>教育・情報が集中しています。</p>
      </div>

      <div class="story-connector">
        <div class="eq">＝</div>
        <div class="eq-label">比較</div>
      </div>

      <div class="story-card">
        <div class="story-card-num">02</div>
        <h3>地方</h3>
        <p>情報が届きにくく、機会が限られます。</p>
      </div>
    </div>

    <div class="wrap" style="margin-top:40px">
      <div class="story-map">
        <img src="assets/story-map-world.png" alt="world map">
      </div>
    </div>
  </section>

  <section id="services">
    <div class="wrap sec-head">
      <div class="sec-tag">Services</div>
      <h2 class="sec-title">提供サービス</h2>
    </div>

    <div class="wrap services-grid">
      <div class="service">
        <div class="service-visual"><img src="assets/service-01-platform.jpg" alt="platform"></div>
        <div class="service-body">
          <div class="service-num">01</div>
          <h4>Platform</h4>
          <p>留学・キャリア支援プラットフォーム</p>
        </div>
      </div>

      <div class="service">
        <div class="service-visual"><img src="assets/service-02-rural.jpg" alt="rural"></div>
        <div class="service-body">
          <div class="service-num">02</div>
          <h4>Rural Support</h4>
          <p>地域医療支援</p>
        </div>
      </div>

      <div class="service">
        <div class="service-visual"><img src="assets/service-03-career.jpg" alt="career"></div>
        <div class="service-body">
          <div class="service-num">03</div>
          <h4>Career</h4>
          <p>国際キャリア支援</p>
        </div>
      </div>
    </div>
  </section>

  <!-- footer and other content omitted for brevity -->

</main>

</body>
</html>
